  --color-background: #F2EDE2;   /* Paper — page background */
  --color-surface: #FBF8F2;      /* Ivory — cards */
  --color-ink: #17201B;          /* Ink — headings */
  --color-secondary: #3A463F;    /* Body text */
  --color-muted: #5E6A62;        /* Metadata */
  --color-border: #D9D0BD;       /* Hairlines */
  --color-card: #EDE6D8;         /* Subtle fills */
  --color-accent: #127545;       /* Forest — buttons, hovers, active states */
  --color-accent-hover: #0E6038;
  --color-on-accent: #F2EDE2;    /* Text on forest */
  --color-gold: #DFAA2C;         /* Gilt — dots, markers */
  --color-gold-deep: #825F13;    /* Gilt text on paper */
  --color-gold-tint: #F6E6B7;
  --color-dark: #0C3D25;         /* Deep forest — footer, dark cards */
  --color-on-dark: #F2EDE2;
  --color-on-dark-muted: #AFCDB6;
  --color-dark-line: #285E42;
  --radius-card: 12px;
  --content-max: 1440px;
  --pad-x: 20px;
  --gap: 12px;
  --header-h: 68px;
  --section-pad: clamp(72px, 10vw, 144px);

  /* Typeface — Poppins (embedded in this file), system fallbacks */
  --font-display: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-body: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;

  --ease: cubic-bezier(.2, .7, .2, 1);
  --t-fast: 220ms;
  --t-slow: 650ms;
}
@media (min-width: 641px)  { :root { --pad-x: 32px; --gap: 14px; } }
@media (min-width: 1101px) { :root { --pad-x: clamp(56px, 5vw, 80px); --gap: 14px; } }

/* ==========================================================================
   BASE
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 16px); }
body {
  margin: 0;
  padding-top: var(--header-h);
  background: var(--color-background);
  color: var(--color-secondary);
  font-family: var(--font-body);
  font-size: clamp(15px, 0.25vw + 14.2px, 17px);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
body.is-locked { overflow: hidden; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, h4 { font-family: var(--font-display); color: var(--color-ink); margin: 0; font-weight: 700; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
::selection { background: var(--color-accent); color: var(--color-on-accent); }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; border-radius: 4px; }
.on-dark :focus-visible, .on-dark:focus-visible { outline-color: var(--color-gold); }

.wrap { width: 100%; max-width: var(--content-max); margin-inline: auto; padding-inline: var(--pad-x); }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: fixed; left: 12px; top: -60px; z-index: 200; background: var(--color-ink); color: var(--color-on-dark); padding: 10px 16px; border-radius: var(--radius-small); }
.skip-link:focus { top: 12px; }
.mono { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.02em; line-height: 1.4; }
.is-hidden { display: none !important; }

/* ==========================================================================
   SHARED COMPONENTS — buttons, tags, media placeholders
   ========================================================================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px; padding: 0 20px;
  border-radius: 8px; border: 1px solid var(--color-ink);
  font-family: var(--font-body); font-size: 15px; font-weight: 600; line-height: 1;
  transition: background-color var(--t-fast) var(--ease), color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
  white-space: nowrap;
}
.btn .arrow { display: inline-block; transition: transform var(--t-fast) var(--ease); }
.btn:hover .arrow, .btn:focus-visible .arrow { transform: translate(2px, -2px); }
.btn--primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }
.btn--primary:hover { background: var(--color-dark); border-color: var(--color-dark); color: var(--color-on-dark); }
.btn--ghost { background: transparent; color: var(--color-ink); }
.btn--ghost:hover { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }
.btn--accent { background: var(--color-on-dark); border-color: var(--color-on-dark); color: var(--color-dark); }
.btn--accent:hover { background: var(--color-gold); border-color: var(--color-gold); color: var(--color-ink); }
.btn--ghost-dark { background: transparent; border-color: var(--color-dark-line); color: var(--color-on-dark); }
.btn--ghost-dark:hover { border-color: var(--color-on-dark); }

.tag {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 24px; padding: 0 9px; border-radius: 999px;
  border: 1px solid var(--color-border); background: var(--color-surface);
  font-family: var(--font-mono); font-size: 11px; color: var(--color-secondary); white-space: nowrap;
}
.tag--accent { background: var(--color-gold-tint); border-color: var(--color-gold-tint); color: var(--color-gold-deep); }
.tag--live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #5FA800; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--color-gold); box-shadow: 0 0 0 1px rgba(130,95,19,.4); flex: none; }

/* Media: every image goes through this wrapper. If an image file is missing,
   a labelled placeholder with the expected file path is shown instead. */
.media { display: block; position: relative; overflow: hidden; aspect-ratio: var(--ratio, 16 / 10); background: var(--color-card); border-radius: var(--radius-card); }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--focal, 50% 50%); transition: transform 700ms var(--ease); }
.media--fill { position: absolute; inset: 0; aspect-ratio: auto; border-radius: 0; }
.media--contain img { object-fit: contain; }
.media-ph { display: none; }
.media.is-missing img { display: none; }
.media.is-missing .media-ph {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
  padding: clamp(10px, 1.4vw, 18px);
  background-color: var(--color-card);
  background-image: repeating-linear-gradient(135deg, transparent 0 11px, rgba(14,59,37,.06) 11px 12px);
}
.media-ph-label { font-family: var(--font-display); font-weight: 700; font-size: clamp(14px, 1.3vw, 18px); color: var(--color-muted); letter-spacing: -0.01em; line-height: 1.2; }
.media-ph-path { font-family: var(--font-mono); font-size: 10.5px; color: var(--color-muted); word-break: break-all; line-height: 1.35; }
.media--mini .media-ph-path { display: none; }
.media--mini .media-ph-label { font-size: 13px; }
.media-ph-path::before { content: "Add image · "; color: var(--color-secondary); }
.on-dark .media.is-missing .media-ph { background-color: #1A1D1B; background-image: repeating-linear-gradient(135deg, transparent 0 11px, rgba(242,237,226,.05) 11px 12px); }
.on-dark .media-ph-label, .on-dark .media-ph-path { color: var(--color-on-dark-muted); }
.on-dark .media--mini .media-ph-path { display: none; }
.media--mini .media-ph-label { font-size: 13px; }
.media-ph-path::before { color: var(--color-on-dark); }

/* Editable placeholder text (missing case-study copy, testimonials) */
.placeholder {
  display: block; padding: 14px 16px; border: 1px dashed #B9BEB4; border-radius: var(--radius-small);
  background: rgba(255,255,255,.5); color: var(--color-muted); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55;
}
.placeholder::before { content: "Placeholder: "; color: var(--color-secondary); }

/* Logo with text fallback */
.logo-img { max-height: 34px; max-width: 70%; width: auto; object-fit: contain; filter: grayscale(1) contrast(1.1); opacity: .85; transition: filter var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease); }
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: clamp(20px, 1.8vw, 28px); letter-spacing: -0.03em; color: var(--color-ink); line-height: 1; }

/* Reveal on scroll (kept deliberately small) */
.reveal { opacity: 0; transform: translateY(14px); transition: opacity var(--t-slow) var(--ease), transform var(--t-slow) var(--ease); }
.reveal.is-in { opacity: 1; transform: none; }

/* ==========================================================================
   SCROLL PROGRESS + HEADER + NAVIGATION
   ========================================================================== */
.progress { position: fixed; inset: 0 0 auto 0; height: 2px; z-index: 120; pointer-events: none; }
.progress span { display: block; height: 100%; background: var(--color-accent); transform-origin: 0 50%; transform: scaleX(0); }

.site-header { position: fixed; inset: 0 0 auto 0; height: var(--header-h); z-index: 100; transition: background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); border-bottom: 1px solid transparent; }
.site-header.is-scrolled { background: rgba(242, 237, 226, .88); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); border-bottom-color: var(--color-border); }
.header-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand-mark { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: 0.04em; color: var(--color-ink); }
.brand-mark__ug { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 7px; background: var(--color-accent); color: var(--color-on-accent); font-size: 13px; letter-spacing: 0; }
.nav-desktop { display: none; align-items: center; gap: 4px; }
.nav-link { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--color-secondary); border-radius: 8px; transition: color var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease); }
.nav-link::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); box-shadow: 0 0 0 1px rgba(14,59,37,.3); transform: scale(0); transition: transform var(--t-fast) var(--ease); }
.nav-link:hover { color: var(--color-ink); background: rgba(14,59,37,.04); }
.nav-link.is-active { color: var(--color-accent); }
.nav-link.is-active::before { transform: scale(1); }
.nav-resume { margin-left: 10px; min-height: 40px; padding: 0 16px; font-size: 14px; }
.menu-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; min-width: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-surface); font-size: 14px; font-weight: 600; color: var(--color-ink); }
.menu-toggle__lines { position: relative; width: 16px; height: 10px; }
.menu-toggle__lines::before, .menu-toggle__lines::after { content: ""; position: absolute; left: 0; width: 100%; height: 1.5px; background: currentColor; transition: transform var(--t-fast) var(--ease), top var(--t-fast) var(--ease); }
.menu-toggle__lines::before { top: 1px; }
.menu-toggle__lines::after { top: 7px; }
.menu-toggle[aria-expanded="true"] .menu-toggle__lines::before { top: 4px; transform: rotate(45deg); }
.menu-toggle[aria-expanded="true"] .menu-toggle__lines::after { top: 4px; transform: rotate(-45deg); }
@media (min-width: 1025px) { .nav-desktop { display: flex; } .menu-toggle { display: none; } }

.mobile-menu { position: fixed; inset: var(--header-h) 0 0 0; z-index: 99; background: var(--color-background); padding: 24px var(--pad-x) 32px; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; opacity: 0; visibility: hidden; transform: translateY(-8px); transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease), visibility 0s linear var(--t-fast); }
.mobile-menu.is-open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.mobile-menu__list a { display: flex; align-items: baseline; justify-content: space-between; min-height: 64px; padding: 10px 0; border-bottom: 1px solid var(--color-border); font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 9vw, 44px); letter-spacing: -0.035em; color: var(--color-ink); }
.mobile-menu__list a span { font-family: var(--font-mono); font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--color-muted); }
.mobile-menu__foot { padding-top: 28px; display: grid; gap: 6px; color: var(--color-muted); font-size: 14px; }
.mobile-menu__foot a { color: var(--color-ink); font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }

/* ==========================================================================
   SECTION SHELL — shared section head used by every homepage section
   ========================================================================== */
.section { padding-block: var(--section-pad); }

.section-rule { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-top: 14px; border-top: 1px solid var(--color-accent); margin-bottom: clamp(22px, 3vw, 40px); color: var(--color-muted); }
.section-rule strong { color: var(--color-ink); font-weight: 500; }
.section-head { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); align-items: end; margin-bottom: clamp(32px, 4.5vw, 64px); }
.section-head h2 { grid-column: 1 / -1; font-size: clamp(30px, 4.6vw, 68px); line-height: .98; letter-spacing: -0.045em; font-weight: 800; text-transform: uppercase; text-wrap: balance; }
.section-head p { grid-column: 1 / -1; max-width: 42ch; color: var(--color-secondary); font-size: clamp(15px, 1.1vw, 18px); }
@media (min-width: 900px) {
  .section-head h2 { grid-column: 1 / span 8; }
  .section-head p { grid-column: 9 / -1; justify-self: end; text-align: left; }
}

/* ==========================================================================
   01 — HERO GRID
   ========================================================================== */
.hero { padding-top: clamp(10px, 1.6vw, 22px); padding-bottom: 0; }
.ruler { display: none; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-bottom: 8px; }
.ruler span { position: relative; height: 18px; border-left: 1px solid var(--color-border); padding-left: 6px; font-family: var(--font-mono); font-size: 10px; line-height: 18px; color: var(--color-muted); transition: color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
.ruler span::after { content: ""; position: absolute; left: -1px; right: 0; bottom: 0; height: 2px; background: var(--color-accent); transform: scaleX(0); transform-origin: 0 50%; transition: transform var(--t-fast) var(--ease); }
.ruler span.is-on { color: var(--color-accent); border-color: var(--color-accent); }
.ruler span.is-on::after { transform: scaleX(1); }
@media (min-width: 641px) { .ruler { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); } .ruler span:nth-child(n+9) { display: none; } }
@media (min-width: 1101px) { .ruler { grid-template-columns: repeat(12, minmax(0, 1fr)); } .ruler span:nth-child(n+9) { display: block; } }

.hero-grid {
  display: grid; gap: var(--gap);
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-areas:
    "i i i i"
    "a a b b"
    "c c e e"
    "d d d d"
    "g g g g"
    "f f f f"
    "h h h h";
}
@media (min-width: 641px) {
  .hero-grid {
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: auto minmax(170px, auto) minmax(170px, auto) minmax(170px, auto) auto;
    grid-template-areas:
      "i i i i i i i i"
      "a a a b b c c c"
      "d d d d e e e e"
      "d d d d f f f f"
      "g g g h h h h h";
  }
}
@media (min-width: 1101px) {
  .hero-grid {
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-template-rows: minmax(min-content, .8fr) 1fr 1fr minmax(min-content, .85fr);
    min-height: clamp(660px, calc(100svh - var(--header-h) - 64px), 940px);
    grid-template-areas:
      "a a a i i i i i i b b b"
      "d d d i i i i i i c c c"
      "d d d i i i i i i e e e"
      "f f f f g g g h h h h h";
  }
}

.tile {
  position: relative; min-width: 0; min-height: 150px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
  padding: clamp(14px, 1.4vw, 20px);
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-card);
  color: var(--color-secondary);
  transition: transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
a.tile:hover, button.tile:hover, .tile--interactive:hover { transform: translateY(-3px); border-color: #C5CABF; box-shadow: 0 10px 24px -18px rgba(14,59,37,.35); }
.tile__top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; color: var(--color-muted); }
.tile__arrow { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--color-border); color: var(--color-ink); font-size: 13px; flex: none; transition: transform var(--t-fast) var(--ease), background-color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease); }
a.tile:hover .tile__arrow, a.tile:focus-visible .tile__arrow { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); transform: rotate(0deg) translate(1px, -1px); }

/* Load sequence: intro first, then surrounding cards */
@keyframes tile-in { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: none; } }
.js .hero-grid > * { animation: tile-in 620ms var(--ease) both; animation-delay: calc(180ms + var(--i, 0) * 70ms); }
.js .hero-grid > .tile--intro { animation-delay: 0ms; }

/* Intro card */
.tile--intro { grid-area: i; padding: clamp(24px, 2.6vw, 44px); justify-content: space-between; gap: 24px; background: var(--color-surface); }
.intro__eyebrow { display: flex; align-items: center; gap: 10px; color: var(--color-secondary); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; }
.intro__name { margin-top: clamp(14px, 1.4vw, 22px); font-weight: 800; font-size: clamp(42px, 5.6vw, 100px); line-height: .88; letter-spacing: -0.055em; text-transform: uppercase; }
.intro__name span { display: block; }
.intro__title { margin-top: clamp(12px, 1.2vw, 18px); font-family: var(--font-display); font-weight: 600; font-size: clamp(18px, 1.7vw, 26px); letter-spacing: -0.02em; color: var(--color-ink); }
.intro__desc { max-width: 40ch; font-size: clamp(15px, 1.15vw, 18px); color: var(--color-secondary); }
.intro__loc { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--color-muted); }
.intro__ctas { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
@media (min-width: 641px) and (max-width: 1100px) { .intro__name { font-size: clamp(56px, 8.4vw, 92px); } }
@media (max-width: 380px) { .intro__ctas .btn { flex: 1 1 100%; } }

/* Brand cards */
.tile--brand .logo-slot { flex: 1; display: flex; align-items: center; }
.tile--brand:hover .logo-img, .tile--brand:focus-visible .logo-img { filter: none; opacity: 1; }
.tile__reveal { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.tile__reveal-text { font-size: 13.5px; line-height: 1.35; color: var(--color-ink); font-weight: 500; }
@media (hover: hover) and (pointer: fine) {
  .tile--brand .tile__reveal-text { opacity: 0; transform: translateY(6px); transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
  .tile--brand:hover .tile__reveal-text, .tile--brand:focus-visible .tile__reveal-text { opacity: 1; transform: none; }
}
.tile--a { grid-area: a; } .tile--b { grid-area: b; } .tile--c { grid-area: c; } .tile--d { grid-area: d; }
.tile--e { grid-area: e; } .tile--f { grid-area: f; } .tile--g { grid-area: g; } .tile--h { grid-area: h; }

/* Stat card */
.tile--stat { background: var(--color-card); }
.stat__value { font-family: var(--font-display); font-weight: 800; font-size: clamp(52px, 4.8vw, 80px); line-height: .85; letter-spacing: -0.06em; color: var(--color-ink); font-variant-numeric: tabular-nums; }
.stat__value sup { font-size: .5em; vertical-align: top; position: relative; top: .08em; letter-spacing: 0; }
.stat__label { margin-top: 8px; color: var(--color-secondary); font-size: 13px; line-height: 1.35; max-width: 26ch; }

/* Visual preview card */
.tile--visual { padding: 0; overflow: hidden; min-height: 260px; }
.tile--visual .media img { transition: transform 900ms var(--ease); }
.tile--visual:hover .media img, .tile--visual:focus-visible .media img { transform: scale(1.045); }
.tile--visual .tile__caption { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,.92); color: var(--color-ink); font-size: 13px; font-weight: 500; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }

/* Testimonial card */
.tile--quote { cursor: default; }
.quote__mark { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: .6; color: var(--color-ink); }
.quote__excerpt { font-family: var(--font-display); font-weight: 500; font-size: clamp(15px, 1.15vw, 17px); line-height: 1.4; color: var(--color-ink); letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.quote__excerpt.is-placeholder { font-family: var(--font-mono); font-size: 12px; color: var(--color-muted); font-weight: 400; letter-spacing: 0; }

      '<div class="explore-grid">' +
      '<a class="explore-card reveal" href="#/case-studies"><div><p class="explore-card__eyebrow">' + esc(e.caseStudies.eyebrow) + "</p><h2>" + esc(e.caseStudies.title) + "</h2><p>" + esc(e.caseStudies.description) + "</p></div>" +
      '<div class="explore-card__bottom"><span class="explore-card__cta"><span>' + esc(e.caseStudies.cta) + '</span><span class="arrow" aria-hidden="true">' + ARROW + "</span></span>" +
      '<span class="stack" aria-hidden="true">' + thumbs.map(function (p) { return media({ src: p.thumbnail, fallback: p.thumbnailSource, ratio: "4:5", focal: p.focal, label: p.brand, cls: "media--mini" }); }).join("") + "</span></div></a>" +
      '<a class="explore-card explore-card--dark on-dark reveal" href="#/archive"><div><p class="explore-card__eyebrow">' + esc(e.archive.eyebrow) + "</p><h2>" + esc(e.archive.title) + "</h2><p>" + esc(e.archive.description) + "</p></div>" +
      '<div class="explore-card__bottom"><span class="explore-card__cta"><span>' + esc(e.archive.cta) + '</span><span class="arrow" aria-hidden="true">' + ARROW + "</span></span>" +
      '<span class="collage" aria-hidden="true">' + shots.map(function (v) { return media({ src: v.image, fallback: v.imageSource, ratio: "1:1", focal: v.focal, label: v.brand, cls: "media--mini" }); }).join("") + "</span></div></a>" +
      "</div></div></section>";
  }

  /* ------------------------------------------------------------------------
     07, TESTIMONIALS
     ------------------------------------------------------------------------ */
  function testiParts(t, i) {
    var isPh = t.placeholder || !has(t.quote);
    var quote = isPh
      ? ph("Add a verified testimonial, exact quote, full name, job title and company, in PORTFOLIO_CONTENT.testimonials[" + i + "].")
      : "“" + paragraphs(t.quote) + "”";
    var size = isPh ? "" : t.quote.length > 520 ? "is-long" : t.quote.length > 260 ? "is-medium" : "";
    var author = isPh
      ? "<div><strong>Name to be added</strong><span>Job title, Company</span></div>"
      : (has(t.image) || has(t.imageSource) ? '<img class="testi__avatar" src="' + esc(t.image || t.imageSource) + '"' + (has(t.imageSource) ? ' data-fallback="' + esc(t.imageSource) + '"' : "") + ' alt="" loading="lazy" onerror="__avatarFail(this)">' : "") +
        "<div><strong>" + esc(t.author) + "</strong><span>" + esc([t.position, t.company].filter(Boolean).join(", ")) + "</span></div>";
    return { quote: quote, author: author, isPh: isPh, size: size };
  }

  function testiCard(t, i, hidden) {
    var parts = testiParts(t, i);
    var long = !parts.isPh && has(t.excerpt) && t.quote.length > 260;
    var text = parts.isPh ? parts.quote : "“" + esc(long ? t.excerpt : t.quote) + "”";
    return '<li class="tcard"' + (hidden ? ' aria-hidden="true"' : "") + ">" +
      '<span class="tcard__mark" aria-hidden="true">“</span>' +
      '<blockquote class="tcard__q">' + text + "</blockquote>" +
      '<div class="tcard__foot"><div class="tcard__who">' + parts.author + "</div>" +
      (long ? '<button type="button" class="link-btn tcard__more" data-quote="' + i + '"' + (hidden ? ' tabindex="-1"' : "") + ">Read full</button>" : "") +
      "</div></li>";
  }

  var ICON_PAUSE = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>';
  var ICON_PLAY = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M7 5v14l12-7z"/></svg>';

  function renderTestimonials() {
    var s = C.testimonialsSection, list = visible(C.testimonials);
    if (!list.length) return "";
    /* One "set" must be wider than the screen for a seamless loop, so short lists repeat.
       Only the first copy of each testimonial is read by screen readers. */
    var reps = Math.max(1, Math.ceil(5 / list.length)), set = "";
    for (var r = 0; r < reps; r++) set += list.map(function (t, i) { return testiCard(t, i, r > 0); }).join("");
    var clone = "";
    for (var r2 = 0; r2 < reps; r2++) clone += list.map(function (t, i) { return testiCard(t, i, true); }).join("");
    var perSet = reps * list.length;
    return '<section id="testimonials" class="section" aria-labelledby="testi-title"><div class="wrap">' +
      sectionHead({ slug: "Testimonials", count: list.length + (list.length === 1 ? " voice" : " voices"), title: s.title, supporting: s.supporting, id: "testi-title" }) +
      '<div class="tmarquee reveal" data-marquee>' +
      '<div class="tmarquee__viewport"><ul class="tmarquee__track" style="--dur:' + (perSet * (s.secondsPerCard || 9)) + 's">' + set + clone + "</ul></div>" +
      '<div class="tmarquee__controls"><button type="button" class="round-btn" data-marquee-toggle aria-pressed="false" aria-label="Pause testimonials">' + ICON_PAUSE + "</button></div>" +
      "</div></div></section>";
  }

  function initMarquee(root) {
    $$("[data-marquee]", root).forEach(function (box) {
      var btn = $("[data-marquee-toggle]", box);
      if (!btn) return;
      btn.addEventListener("click", function () {
        var paused = box.classList.toggle("is-paused");
        btn.setAttribute("aria-pressed", String(paused));
        btn.setAttribute("aria-label", paused ? "Play testimonials" : "Pause testimonials");
        btn.innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
      });
    });
  }

  /* Full testimonial dialog */
  var qd = $("#quote-dialog"), qdTrigger = null;
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-quote]");
    if (!b || !qd) return;
    var t = visible(C.testimonials)[parseInt(b.dataset.quote, 10)];
    if (!t) return;
    var parts = testiParts(t, 0);
    $(".qdialog__q", qd).innerHTML = parts.quote;
    $(".qdialog__who", qd).innerHTML = parts.author;
    qdTrigger = b;
    var mq = b.closest("[data-marquee]"); if (mq) mq.classList.add("is-held");
    if (typeof qd.showModal === "function") qd.showModal(); else qd.setAttribute("open", "");
    $(".qdialog__close", qd).focus();
  });
  if (qd) {
    $(".qdialog__close", qd).addEventListener("click", function () { qd.close(); });
    qd.addEventListener("click", function (e) { if (e.target === qd) qd.close(); });
    qd.addEventListener("close", function () {
      $$("[data-marquee].is-held").forEach(function (m) { m.classList.remove("is-held"); });
      if (qdTrigger) qdTrigger.focus();
    });
  }

  /* ------------------------------------------------------------------------
     08, CONTACT FOOTER (rendered on every page)

    if (!SECTION_SETTINGS.contact) {

        '</span><button type="button" class="link-btn" data-top>Back to top ' + ICON.n + '</button></div></div></footer>';
    }
    return '<footer id="contact" class="site-footer on-dark" aria-labelledby="contact-title"><div class="wrap">' +

      '<h2 id="contact-title" class="footer__headline">' + esc(c.headline) + "</h2>" +
      '<p class="footer__sub">' + esc(c.availabilityText) + "</p>" +
      '<div class="footer__ctas"><a class="btn btn--accent" href="mailto:' + esc(c.email) + '">' + esc(c.primaryCta) + ' <span class="arrow" aria-hidden="true">' + ARROW + "</span></a>" +
      '<a class="btn btn--ghost-dark" href="' + esc(c.resume) + '" target="_blank" rel="noopener noreferrer" download>' + esc(c.resumeCta) + ' <span class="arrow" aria-hidden="true">' + ARROW + "</span></a></div>" +
      '<div class="footer__grid">' +
      '<div class="footer__item"><span class="mono">Email</span><a href="mailto:' + esc(c.email) + '">' + esc(c.email) + "</a></div>" +
      '<div class="footer__item"><span class="mono">LinkedIn</span><a href="' + esc(c.linkedin) + '" target="_blank" rel="noopener noreferrer">' + esc(C.site.name) + " " + ARROW + "</a></div>" +
      '<div class="footer__item"><span class="mono">Résumé</span><a href="' + esc(c.resume) + '" target="_blank" rel="noopener noreferrer">Open résumé ' + ARROW + "</a></div>" +
      "</div>" +
      '<div class="footer__bottom"><span>' + esc(C.site.copyright) + "</span>" +
      (has(c.social) ? '<ul class="footer__social">' + c.social.map(function (s) { return '<li><a class="link-btn" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.label) + "</a></li>"; }).join("") + "</ul>" : "") +
      '<button type="button" class="link-btn" data-top>Back to top ' + ICON.n + '</button></div>' +
      "</div></footer>";
  }

  /* ------------------------------------------------------------------------
     SUB-PAGES
     ------------------------------------------------------------------------ */
  function crumbs(items) {
    return '<nav class="crumbs mono" aria-label="Breadcrumb">' + items.map(function (it, i) {
      return (i ? '<span aria-hidden="true">/</span>' : "") + (it.href ? '<a href="' + it.href + '">' + esc(it.label) + "</a>" : '<span aria-current="page">' + esc(it.label) + "</span>");
    }).join("") + "</nav>";
  }

  /* ------------------------------------------------------------------------
     BRANDING, index of brand boxes + one page per brand (#/branding/<id>)
     ------------------------------------------------------------------------ */
  function brandings() { return visible(C.branding); }

  function renderBrandingIndex() {
    var s = C.brandingSection || {}, list = brandings();
    return '<section class="page-hero"><div class="wrap">' + crumbs([{ label: "Home", href: "#/" }, { label: "Branding" }]) +
      '<h1 class="page-title" tabindex="-1">' + esc(s.title || "Branding.") + '</h1><p class="page-intro">' + esc(s.intro || "") + "</p></div></section>" +
      '<section class="section" style="padding-top:0" aria-label="Brands"><div class="wrap">' +
      '<div class="section-rule mono"><span><strong>Brands</strong></span><span>' + list.length + (list.length === 1 ? " brand" : " brands") + "</span></div>" +
      (list.length ? '<ul class="bgrid">' + list.map(function (b, i) {
        var visual = (has(b.cover) || has(b.coverSource))
          ? media({ src: b.cover, fallback: b.coverSource, alt: "", ratio: "4:3", focal: b.focal, label: b.name, cls: "bbox__cover" })
          : '<span class="bbox__logo" style="' + (has(b.tint) ? "background:" + esc(b.tint) : "") + '">' + logo(b.logo, b.name, b.name + " logo") + "</span>";
        return '<li class="reveal"><a class="bbox" href="#/branding/' + esc(b.id) + '">' + visual +
          '<span class="bbox__body"><span class="bbox__top"><span class="mono">' + pad(i + 1) + (has(b.year) ? " / " + esc(b.year) : "") + '</span><span class="tile__arrow" aria-hidden="true">' + ARROW + "</span></span>" +
          '<span class="bbox__name">' + esc(b.name) + "</span>" +
          '<span class="bbox__desc">' + esc(b.description) + "</span>" +
          (has(b.scope) ? '<span class="bbox__scope mono">' + esc(b.scope) + "</span>" : "") +
          "</span></a></li>";
      }).join("") + "</ul>"
        : '<div class="bempty"><p class="bempty__title">No brands yet.</p><p>Add a brand to <code>PORTFOLIO_CONTENT.branding</code> and its box appears here.</p></div>') +
      "</div></section>";
  }

  function brandBlock(bl) {
    var t = bl.type;
    if (t === "text") return '<section class="bblock bblock--text reveal">' + (has(bl.title) ? "<h2>" + esc(bl.title) + "</h2>" : "") + (has(bl.body) ? "<p>" + paragraphs(bl.body) + "</p>" : "") + "</section>";
    if (t === "image") return '<figure class="bblock bblock--image reveal">' + media({ src: bl.src, fallback: bl.srcSource, alt: bl.alt || bl.caption || "", ratio: bl.ratio || "16:9", focal: bl.focal, label: "Image" }) + (has(bl.caption) ? "<figcaption>" + esc(bl.caption) + "</figcaption>" : "") + "</figure>";
    if (t === "gallery") return '<section class="bblock reveal">' + (has(bl.title) ? "<h2>" + esc(bl.title) + "</h2>" : "") + '<div class="bgallery" style="--cols:' + (bl.columns || 2) + '">' + (bl.images || []).map(function (im) {
      return '<figure>' + media({ src: im.src, fallback: im.srcSource, alt: im.alt || im.caption || "", ratio: im.ratio || bl.ratio || "4:3", focal: im.focal, label: "Image" }) + (has(im.caption) ? "<figcaption>" + esc(im.caption) + "</figcaption>" : "") + "</figure>";
    }).join("") + "</div></section>";
    if (t === "colours") return '<section class="bblock reveal">' + (has(bl.title) ? "<h2>" + esc(bl.title) + "</h2>" : "") + '<ul class="swatches">' + (bl.swatches || []).map(function (sw) {
      return '<li><span class="swatch" style="background:' + esc(sw.hex) + '"></span><span class="swatch__name">' + esc(sw.name) + '</span><span class="mono">' + esc(sw.hex) + "</span></li>";
    }).join("") + "</ul></section>";
    if (t === "type") return '<section class="bblock reveal">' + (has(bl.title) ? "<h2>" + esc(bl.title) + "</h2>" : "") + '<div class="typespec"><p class="typespec__name">' + esc(bl.name) + '</p><p class="typespec__sample" style="' + (has(bl.css) ? esc(bl.css) : "") + '">' + esc(bl.sample || "Aa Bb Cc 0123") + "</p>" + (has(bl.note) ? '<p class="mono">' + esc(bl.note) + "</p>" : "") + "</div></section>";
    return "";
  }

  function renderBrandPage(id) {
    var list = brandings(), i = list.findIndex(function (b) { return b.id === id; });
    if (i < 0) return '<section class="page-hero"><div class="wrap">' + crumbs([{ label: "Home", href: "#/" }, { label: "Branding", href: "#/branding" }, { label: "Not found" }]) +
      '<h1 class="page-title" tabindex="-1">Brand not found.</h1><p style="margin-top:28px"><a class="btn btn--primary" href="#/branding">See all brands <span class="arrow" aria-hidden="true">' + ARROW + "</span></a></p></div></section>";
    var b = list[i], next = list[(i + 1) % list.length];
    var blocks = b.blocks || [];
    return '<article class="brandpage">' +
      '<section class="page-hero"><div class="wrap">' + crumbs([{ label: "Home", href: "#/" }, { label: "Branding", href: "#/branding" }, { label: b.name }]) +
      '<div class="bhead">' +
      '<span class="bhead__logo">' + logo(b.logo, b.name, b.name + " logo") + "</span>" +
      '<div><h1 class="bhead__title" tabindex="-1">' + esc(b.name) + '</h1><p class="bhead__desc">' + esc(b.description) + "</p></div>" +
      "</div>" +
      '<dl class="cs-meta">' + [["Year", b.year], ["Scope", b.scope], ["Role", b.role], ["Client", b.client]].filter(function (m) { return has(m[1]); }).map(function (m) {
        return "<div><dt>" + esc(m[0]) + "</dt><dd>" + esc(m[1]) + "</dd></div>"; }).join("") + "</dl>" +
      "</div></section>" +
      '<div class="wrap bblocks">' +
      (blocks.length ? blocks.map(brandBlock).join("")
        : '<div class="bempty bempty--canvas"><p class="bempty__title">Branding for ' + esc(b.name) + ' goes here.</p><p>Add blocks to this brand in <code>PORTFOLIO_CONTENT.branding</code>: text, image, gallery, colours or type. They appear here in order.</p></div>') +
      "</div>" +
      nextBand({ endLabel: "End of " + b.name, label: "Next brand", title: next.name, meta: next.scope, cta: "View the next brand",
        href: list.length > 1 ? "#/branding/" + esc(next.id) : "", allHref: "#/branding", allLabel: "Back to all brands",
        visual: (has(next.cover) || has(next.coverSource))
          ? media({ src: next.cover, fallback: next.coverSource, alt: "", ratio: "4:3", focal: next.focal, label: next.name })
          : '<span class="next-band__logo">' + logo(next.logo, next.name, next.name + " logo") + "</span>" }) +
      "</article>";
  }

  /* End-of-page "up next" band, used by case studies and brand pages */
  function nextBand(o) {
    return '<section class="next-band" aria-label="' + esc(o.label) + '"><div class="wrap">' +
      '<p class="next-band__end"><span aria-hidden="true"></span><span class="mono">' + esc(o.endLabel) + '</span><span aria-hidden="true"></span></p>' +

  function renderCaseIndex() {

      list = list.map(function (p, i) { return { p: p, i: i }; }).sort(function (x, y) {

      }).map(function (o) { return o.p; });
    }
    return '<section class="cs-banner"><div class="wrap">' + crumbs([{ label: "Home", href: "#/" }, { label: "Case studies" }]) +
      '<div class="cs-banner__frame">' +
      media({ src: bn.image, fallback: bn.imageSource, alt: bn.alt || "", ratio: "21:9", focal: bn.focal, eager: true, label: "Banner image", cls: "cs-banner__media" }) +
      '<div class="cs-banner__text"><h1 class="cs-banner__title" tabindex="-1">' + esc(e.title) + "</h1>" +

      '<section class="section cs-index" aria-label="All case studies"><div class="wrap">' +
      '<div class="section-rule mono"><span><strong>All projects</strong></span><span>' + list.length + " case studies</span></div>" +
      '<ul class="cs-grid">' + list.map(function (p) {

          '<span class="cs-card__arrow" aria-hidden="true">' + ARROW + "</span></span></a></li>";

  function gallery(images, fallbackPaths, label) {

  function renderCase(id) {

      return '<section class="page-hero"><div class="wrap">' + crumbs([{ label: "Home", href: "#/" }, { label: "Case studies", href: "#/case-studies" }, { label: "Not found" }]) +

    }
    var p = list[idx], cs = p.caseStudy || {}, next = list[(idx + 1) % list.length];

    function block(title, inner) {
      n++;

    function para(v, hint) { return has(v) ? "<p>" + esc(v) + "</p>" : ph(hint); }
    function bullets(arr, hint) { return has(arr) ? '<ul class="bullets">' + arr.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : (hint ? ph(hint) : ""); }
    function metaVal(v) { return has(v) ? esc(Array.isArray(v) ? v.join(", ") : v) : ph("Add"); }
    var base = "assets/projects/" + p.id;

    return '<article class="case">' +
      '<section class="page-hero"><div class="wrap">' +
      crumbs([{ label: "Home", href: "#/" }, { label: "Case studies", href: "#/case-studies" }, { label: p.brand }]) +
      (has(cs.status) ? '<p class="cs-status"><span class="dot" aria-hidden="true" style="margin-top:6px"></span><span><strong style="color:var(--color-ink)">' + esc(cs.status) + ".</strong> Sections marked “Placeholder” are waiting for final copy and images.</span></p>" : "") +
      '<div class="cs-headline"><h1 tabindex="-1">' + esc(p.title) + "</h1><p>" + esc(p.description) + "</p>" +
      (has(p.externalUrl) ? '<a class="btn btn--ghost cs-ext" ' + linkAttrs(p.externalUrl) + '>View full project on Behance <span class="arrow" aria-hidden="true">' + ARROW + "</span></a>" : "") + "</div>" +
      media({ src: p.heroImage, fallback: p.heroImageSource, alt: p.title + ", hero image", ratio: "16:9", focal: p.focal, eager: true, cls: "cs-hero-media", label: p.brand + ", hero image" }) +
      '<dl class="cs-meta">' +
      [["Client / brand", cs.client || p.brand], ["Year", p.year], ["Industry", cs.industry], ["Engagement", cs.engagement],
       ["Disciplines", cs.disciplines || p.category], ["Responsibilities", cs.responsibilities], ["Collaborators", cs.collaborators], ["Status", cs.status || "Complete"]]
        .map(function (m) { return "<div><dt>" + esc(m[0]) + "</dt><dd>" + metaVal(m[1]) + "</dd></div>"; }).join("") +
      "</dl></div></section>" +
      '<div class="wrap">' +

    function clear() { cells.forEach(function (c) { c.classList.remove("is-on"); }); }

      t.addEventListener("pointerenter", function () { mark(t); });

      t.addEventListener("focusout", clear);
    });

    // 6+ years: one-off count up

    if (num && !reduced() && "IntersectionObserver" in window) {

      num.textContent = "0";
      var io = new IntersectionObserver(function (en) {

        var step = function (ts) {

          num.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
          if (p < 1) requestAnimationFrame(step);

      });

      spec.addEventListener("pointerenter", function () {
        if (reduced()) return;

      if (e.key === "ArrowRight") { e.preventDefault(); go(1); }

  }

     ROUTER, homepage + #/case-studies, #/case/<id>, #/archive
     ------------------------------------------------------------------------ */
  var main = $("#main"), footerRoot = $("#footer-root"), view = null, firstLoad = true;
  var RENDER = {
    hero: renderHero, brands: renderBrands, featuredProjects: renderWork, experience: renderExperience,
    visuals: renderVisuals, explore: renderExplore, testimonials: renderTestimonials
  };

  function mount(name, html, title) {
    main.innerHTML = html;
    view = name;
    document.title = title;
    initReveal(main); initMasonry(main); initFilters(main); initCopy(main); initSliders(main); initMarquee(main);
    noDrag(main);
    if (name === "home") { initHero(main); initExperience(main); initTestimonials(main); initSectionSpy(); }
    else {
      if (spy) spy.disconnect(); clearActive();
      if (name.indexOf("brand") === 0) $$('.nav-link[href="#/branding"]').forEach(function (l) { l.classList.add("is-active"); });
    }
  }

  /* ------------------------------------------------------------------------
     MULTI-PAGE — each HTML file sets window.__PAGE before this script runs:
     { view: "home" } · { view: "cases" } · { view: "case", id } · { view: "archive" }
     { view: "branding" } · { view: "brand", id }
     ------------------------------------------------------------------------ */
  var PAGE = window.__PAGE || { view: "home" };
  var isHome = PAGE.view === "home";

  /* Content links keep their short form (#/case/stan, #/branding, #work ...).
     They are turned into real file names here, so the content stays editable in one style. */
  function pageFile(href) {
    if (!href) return href;
    var m;
    if (href === "#/") return isHome ? "#main" : "index.html";
    if (href === "#/case-studies") return "case-studies.html";
    if (href === "#/archive") return "visual-archive.html";
    if (href === "#/branding") return "branding.html";
    if ((m = href.match(/^#\/branding\/([\w-]+)$/))) return "brand-" + m[1] + ".html";
    if ((m = href.match(/^#\/case\/([\w-]+)$/))) return "case-study-" + m[1] + ".html";
    if (!isHome && href !== "#main" && /^#[A-Za-z][\w-]*$/.test(href)) return "index.html" + href;
    return href;
  }
  function rewriteLinks(root) {
    $$("a[href]", root).forEach(function (a) {
      var h = a.getAttribute("href"), n = pageFile(h);
      if (n !== h) a.setAttribute("href", n);
    });
  }

  var T = " | " + C.site.name;
  if (PAGE.view === "cases") mount("cases", renderCaseIndex(), "Case Studies" + T);
  else if (PAGE.view === "case") {
    var cp = projects().find(function (x) { return x.id === PAGE.id; });
    mount("case:" + PAGE.id, renderCase(PAGE.id), (cp ? cp.title : "Case study") + T);
  }
  else if (PAGE.view === "archive") mount("archive", renderArchive(), "Visual Archive" + T);
  else if (PAGE.view === "branding") mount("branding", renderBrandingIndex(), "Branding" + T);
  else if (PAGE.view === "brand") {
    var bp = brandings().find(function (x) { return x.id === PAGE.id; });
    mount("brand:" + PAGE.id, renderBrandPage(PAGE.id), (bp ? bp.name + " | Branding" : "Branding") + T);
  }
  else {
    mount("home", SECTION_ORDER.filter(function (k) { return SECTION_SETTINGS[k] && RENDER[k]; }).map(function (k) { return RENDER[k](); }).join(""), C.site.pageTitle);
    var anchor = location.hash ? document.getElementById(location.hash.slice(1)) : null;
    if (anchor) requestAnimationFrame(function () { anchor.scrollIntoView({ behavior: "instant", block: "start" }); });
  }

  footerRoot.innerHTML = renderFooter();
  initCopy(footerRoot);
  rewriteLinks(document);
  noDrag(document);
  onScroll();
})();

  </script>
</body>
</html>
